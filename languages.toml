[[language]]
name = "rust"
auto-format = false
scope = "source.rust"
injection-regex = "rust"
file-types = ["rs"]
roots = ["Cargo.toml", "Cargo.lock"]
comment-tokens = "//"
language-servers = ["rust-analyzer"]
indent = { tab-width = 4, unit = "    " }

[[language]]
name = "python"
auto-format = false
scope = "source.python"
injection-regex = "rust"
file-types = ["py"]
roots = ["pyproject.toml", "uv.lock"]
# comment-tokens = "#"
language-servers = ["pyright"]
indent = { tab-width = 4, unit = "    " }
